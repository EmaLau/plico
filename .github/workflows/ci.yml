name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (API and browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Ghostscript, Tesseract and pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng pandoc
      - name: Documentation pages
        run: sh docs/web/build.sh server/static
      - name: Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: pytest
        run: python -m pytest -v

  docker:
    name: Docker image and selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t plico:ci -f server/Dockerfile .
      - name: Start (small limits, so every check runs)
        run: |
          docker run -d --name plico -e MAX_UPLOAD_MB=50 -e MAX_OUTPUT_MB=8 \
            -e PLICO_ADMIN_PASSWORD=ci-admin-password plico:ci
          for i in $(seq 30); do
            docker exec plico python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')" && break
            sleep 1
          done
      - name: Selftest
        run: docker exec plico python3 /app/selftest.py
      - name: Server log
        if: failure()
        run: docker logs plico
